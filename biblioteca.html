
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Biblioteca Pessoal</title>
    <!-- Tailwind CSS para estilização rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-7xl mx-auto bg-white shadow-md rounded-lg p-6">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">📚 Minha Biblioteca Pessoal</h1>
        
        <!-- Caixa de Pesquisa -->
        <div class="mb-6">
            <input type="text" id="searchInput" placeholder="Pesquisar por título, autor, editora ou ISBN..." 
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Tabela de Livros -->
        <div class="overflow-x-auto">
            <table class="w-full table-auto border-collapse text-sm">
                <thead>
                    <tr class="bg-blue-600 text-white text-left">
                        <th class="p-3">Capa</th>
                        <th class="p-3">Título / Título Original</th>
                        <th class="p-3">Autor(es) / Tradutor</th>
                        <th class="p-3">Editora</th>
                        <th class="p-3">Publicação / Edição / Impressão</th>
                        <th class="p-3">Língua</th>
                        <th class="p-3">Emprestado</th>
                        <th class="p-3">ISBN</th>
                    </tr>
                </thead>
                <tbody id="tabela-livros" class="divide-y divide-gray-200">
                    <tr>
                        <td colspan="8" class="text-center p-6 text-gray-500">Carregando livros...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Substitua SEU_USUARIO e SEU_REPOSITORIO pelos dados reais do seu GitHub
        const URL_JSON = "https://raw.githubusercontent.com/bernard17costa/personal_library/refs/heads/main/livros.json?token=GHSAT0AAAAAAELBMNYTZRKJK6DLTWBX4QRQ2WSMVRA
";

        let listaLivros = [];

        async function carregarBiblioteca() {
            try {
                const response = await fetch(URL_JSON);
                if (!response.ok) throw new Error("Erro ao carregar os dados.");
                
                listaLivros = await response.json();

                // Ordena alfabeticamente por autor (tratando vazios para irem ao fim)
                listaLivros.sort((a, b) => {
                    const autorA = (a.autor || "").toLowerCase();
                    const autorB = (b.autor || "").toLowerCase();
                    return autorA.localeCompare(autorB, 'pt-BR');
                });

                exibirLivros(listaLivros);
            } catch (error) {
                console.error(error);
                document.getElementById("tabela-livros").innerHTML = `
                    <tr><td colspan="8" class="text-center p-6 text-red-500">Erro ao carregar a base de dados. Verifique o link e se o arquivo livros.json é público.</td></tr>
                `;
            }
        }

        function exibirLivros(livros) {
            const tbody = document.getElementById("tabela-livros");
            tbody.innerHTML = "";

            if (livros.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center p-6 text-gray-500">Nenhum livro encontrado.</td></tr>`;
                return;
            }

            livros.forEach(livro => {
                const tr = document.createElement("tr");
                tr.classList.add("hover:bg-gray-50");

                // Trata a capa (se não tiver imagem, mostra um placeholder)
                const capaHtml = livro.capa 
                    ? `<img src="${livro.capa}" alt="Capa" class="w-12 h-16 object-cover rounded shadow">` 
                    : `<div class="w-12 h-16 bg-gray-200 flex items-center justify-center text-[10px] text-gray-400 rounded text-center p-1">Sem capa</div>`;

                // Subtextos organizados para a nova estrutura
                const tituloOriginalHtml = livro["titulo original"] ? `<br><span class="text-xs text-gray-400 italic">Orig: ${livro["titulo original"]}</span>` : "";
                const tradutorHtml = livro.tradutor ? `<br><span class="text-xs text-gray-400">Trad: ${livro.tradutor}</span>` : "";
                
                const detalhesPub = [
                    livro.publicacao ? `Pub: ${livro.publicacao}` : "",
                    livro.edicao ? `Ed: ${livro.edicao}` : "",
                    livro.impressao ? `Imp: ${livro.impressao}` : ""
                ].filter(Boolean).join(" | ");

                tr.innerHTML = `
                    <td class="p-3">${capaHtml}</td>
                    <td class="p-3 font-medium text-gray-800">
                        ${livro.titulo || "<span class='text-amber-600 italic'>Aguardando atualização...</span>"}
                        ${tituloOriginalHtml}
                    </td>
                    <td class="p-3 text-gray-600 font-medium">
                        ${livro.autor || "-"}
                        ${tradutorHtml}
                    </td>
                    <td class="p-3 text-gray-600">${livro.editora || "-"}</td>
                    <td class="p-3 text-gray-600 text-xs">${detalhesPub || "-"}</td>
                    <td class="p-3 text-gray-600">${livro.lingua || "-"}</td>
                    <td class="p-3 text-gray-600">${livro.emprestado ? `<span class="bg-yellow-100 text-yellow-800 px-2 py-1 rounded text-xs font-semibold">${livro.emprestado}</span>` : "-"}</td>
                    <td class="p-3 text-gray-500 font-mono text-xs">${livro.isbn}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Funcionalidade de busca em tempo real (mantém a ordenação por autor nos resultados filtrados se quiser, ou filtra mantendo)
        document.getElementById("searchInput").addEventListener("input", (e) => {
            const termo = e.target.value.toLowerCase();
            const filtrados = listaLivros.filter(livro => 
                (livro.titulo && livro.titulo.toLowerCase().includes(termo)) ||
                (livro["titulo original"] && livro["titulo original"].toLowerCase().includes(termo)) ||
                (livro.autor && livro.autor.toLowerCase().includes(termo)) ||
                (livro.editora && livro.editora.toLowerCase().includes(termo)) ||
                (livro.isbn && livro.isbn.includes(termo))
            );
            exibirLivros(filtrados);
        });

        // Carrega os dados ao abrir a página
        carregarBiblioteca();
    </script>
</body>
</html>
